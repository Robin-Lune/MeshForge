# MeshForge — Configuration Mosquitto 
#
# Les gateways Meshtastic publient leur trafic ici et le worker ne fait que
# SUBSCRIBE. Exception : /admin/annonces publie des paquets chiffrés ; seules les
# gateways dont le downlink est activé peuvent alors les relayer sur la radio.
#
# Auth anonyme : DEV UNIQUEMENT. La prod passe par mosquitto-go-auth +
# allow_anonymous false (cf. docs/deploiement.md et docs/alertes.md).

allow_anonymous true

# Listener MQTT standard (gateways Meshtastic)
listener 1883

# Listener WebSocket (debug / clients web éventuels)
listener 9001
protocol websockets

log_type error
log_type warning
log_type information
